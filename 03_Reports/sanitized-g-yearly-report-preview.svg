<rect x="95" y="590" width="1010" height="54" rx="8" fill="#f2f4f7"/><text x="115" y="622" font-family="Arial,sans-serif" font-size="14" fill="#657089">Layout and status-color example only — not a production or investment report.</text>
<text x="95" y="665" font-family="Arial,sans-serif" font-size="12" fill="#657089">Use at your own risk / 사용 시 주의 · Revalidate after product changes · See DISCLAIMER.md / 면책 조항</text>
